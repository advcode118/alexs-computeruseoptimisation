<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Delivery</title>
</head>
<body>
  <!-- local fixture -->
  <h1>Delivery</h1>
  <form action="echo.html" method="get">
    <label for="reference">Reference</label>
    <input id="reference" name="reference" type="text" autocomplete="off" />
    <label for="express-post">Express post</label>
    <input id="express-post" name="speed" type="radio" value="express-post" />
    <label for="standard-post">Standard post</label>
    <input id="standard-post" name="speed" type="radio" value="standard-post" />
    <button type="submit">Submit order</button>
  </form>
</body>
</html>
