<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile</title>
</head>
<body>
  <!-- local fixture -->
  <h1>Profile</h1>
  <form>
    <label for="full-name">Full name</label>

  </form>
</body>
</html>
