<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Library</title>
</head>
<body>
  <!-- local fixture -->

  <h1>Library</h1>
  <label for="q">Search library</label>
  <input id="q" name="q" type="text" autocomplete="off" />
  <script>
    document.getElementById("q").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      const q = event.target.value;
      location.href = "library-results.html?q=" + encodeURIComponent(q);
    });
  </script>

</body>
</html>
