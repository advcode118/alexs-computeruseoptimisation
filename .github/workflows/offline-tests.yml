name: Offline tests

on:
  pull_request:
  push:
    branches:
      - "t3/**"
      - "cursor/**"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies and Playwright browsers
        run: bash scripts/setup.sh
      - name: Offline suite
        run: .venv/bin/python -m pytest -q bench/test_harness.py tests
