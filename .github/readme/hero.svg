<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Our approach: one model call writes the whole browser task</title>
  <desc id="d">50 held-out tasks, cold, medium effort. gpt-6-luna: script_first 27/50 median 5.98s, Playwright MCP 28/50 median 12.98s, browser-use 40/50 median 20.33s. gpt-6.1-sol: script_first 37/50 median 4.15s, Playwright MCP 38/50 median 13.79s, browser-use 41/50 median 13.81s. Medians are all 50 tasks.</desc>
  <style>
    .display { font-family: 'Bricolage Grotesque', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .sans { font-family: 'Public Sans', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .bar, .pulse { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="96" height="600" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="600" fill="#dfe6f5" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" rx="24" fill="#13224a"/>
  <rect width="1200" height="600" rx="24" fill="url(#grid)"/>

  <circle cx="70" cy="90" r="5" fill="#ff4d8d"/>
  <text x="86" y="96" class="mono" font-size="17" fill="#ff4d8d">script_first, our approach</text>

  <g class="display" font-size="66" font-weight="800" letter-spacing="-2.4" fill="#dfe6f5">
    <text x="62" y="182">One model call</text>
    <text x="62" y="252">writes the whole</text>
    <text x="62" y="322">browser task.</text>
  </g>

  <g class="sans" font-size="20" fill="#9fb0d3">
    <text x="64" y="378">Chrome runs the script. No model between clicks.</text>
    <text x="64" y="406">If the check fails, the model gets one repair.</text>
  </g>

  <rect x="64" y="446" width="560" height="1" fill="#dfe6f5" opacity="0.15"/>
  <g class="mono" font-size="38" font-weight="700" fill="#ff4d8d">
    <text x="64" y="502">50</text>
    <text x="214" y="502">2</text>
    <text x="364" y="502">1</text>
  </g>
  <g class="sans" font-size="15" fill="#dfe6f5">
    <text x="64" y="528">held-out tasks</text>
    <text x="214" y="528">models, cold</text>
    <text x="364" y="528">call writes it</text>
  </g>
  <g class="sans" font-size="13" fill="#9fb0d3">
    <text x="64" y="550">Same set, three arms</text>
    <text x="214" y="550">Luna and Sol</text>
    <text x="364" y="550">No answer key</text>
  </g>

  <text x="688" y="96" class="display" font-size="18" font-weight="600" fill="#dfe6f5">50 tasks, median of all of them</text>
  <g class="sans" font-size="13" fill="#9fb0d3">
    <circle cx="694" cy="122" r="5" fill="#ff4d8d"/>
    <text x="706" y="127">script_first</text>
    <circle cx="820" cy="122" r="5" fill="#dfe6f5" opacity="0.55"/>
    <text x="832" y="127">Playwright MCP</text>
    <circle cx="970" cy="122" r="5" fill="#f0b45a"/>
    <text x="982" y="127">browser-use</text>
  </g>

  <text x="688" y="164" class="mono" font-size="14" font-weight="700" fill="#ff4d8d">gpt-6-luna</text>
  <g>
    <text x="688" y="196" class="mono" font-size="14" font-weight="700" fill="#ff4d8d">script_first</text>
    <text x="1136" y="196" class="mono" font-size="13" fill="#9fb0d3" text-anchor="end">27/50</text>
    <rect x="688" y="206" width="210" height="8" rx="4" fill="#dfe6f5" opacity="0.1"/>
    <rect class="bar" x="688" y="206" width="62" height="8" rx="4" fill="#ff4d8d"/>
    <text x="908" y="214" class="mono" font-size="12" fill="#dfe6f5">5.98s</text>
  </g>
  <g>
    <text x="688" y="246" class="mono" font-size="14" font-weight="700" fill="#dfe6f5">Playwright MCP</text>
    <text x="1136" y="246" class="mono" font-size="13" fill="#9fb0d3" text-anchor="end">28/50</text>
    <rect x="688" y="256" width="210" height="8" rx="4" fill="#dfe6f5" opacity="0.1"/>
    <rect class="bar" x="688" y="256" width="134" height="8" rx="4" fill="#dfe6f5" opacity="0.55"/>
    <text x="908" y="264" class="mono" font-size="12" fill="#dfe6f5">12.98s</text>
  </g>
  <g>
    <text x="688" y="296" class="mono" font-size="14" font-weight="700" fill="#dfe6f5">browser-use</text>
    <text x="1136" y="296" class="mono" font-size="13" fill="#9fb0d3" text-anchor="end">40/50</text>
    <rect x="688" y="306" width="210" height="8" rx="4" fill="#dfe6f5" opacity="0.1"/>
    <rect class="bar" x="688" y="306" width="210" height="8" rx="4" fill="#f0b45a"/>
    <text x="908" y="314" class="mono" font-size="12" fill="#dfe6f5">20.33s</text>
  </g>

  <text x="688" y="360" class="mono" font-size="14" font-weight="700" fill="#ff4d8d">gpt-6.1-sol</text>
  <g>
    <text x="688" y="392" class="mono" font-size="14" font-weight="700" fill="#ff4d8d">script_first</text>
    <text x="1136" y="392" class="mono" font-size="13" fill="#9fb0d3" text-anchor="end">37/50</text>
    <rect x="688" y="402" width="210" height="8" rx="4" fill="#dfe6f5" opacity="0.1"/>
    <rect class="bar" x="688" y="402" width="43" height="8" rx="4" fill="#ff4d8d"/>
    <text x="908" y="410" class="mono" font-size="12" fill="#dfe6f5">4.15s</text>
  </g>
  <g>
    <text x="688" y="442" class="mono" font-size="14" font-weight="700" fill="#dfe6f5">Playwright MCP</text>
    <text x="1136" y="442" class="mono" font-size="13" fill="#9fb0d3" text-anchor="end">38/50</text>
    <rect x="688" y="452" width="210" height="8" rx="4" fill="#dfe6f5" opacity="0.1"/>
    <rect class="bar" x="688" y="452" width="142" height="8" rx="4" fill="#dfe6f5" opacity="0.55"/>
    <text x="908" y="460" class="mono" font-size="12" fill="#dfe6f5">13.79s</text>
  </g>
  <g>
    <text x="688" y="492" class="mono" font-size="14" font-weight="700" fill="#dfe6f5">browser-use</text>
    <text x="1136" y="492" class="mono" font-size="13" fill="#9fb0d3" text-anchor="end">41/50</text>
    <rect x="688" y="502" width="210" height="8" rx="4" fill="#dfe6f5" opacity="0.1"/>
    <rect class="bar" x="688" y="502" width="143" height="8" rx="4" fill="#f0b45a"/>
    <text x="908" y="510" class="mono" font-size="12" fill="#dfe6f5">13.81s</text>
  </g>

  <rect x="688" y="536" width="448" height="36" rx="18" fill="none" stroke="#9fb0d3" stroke-opacity="0.4"/>
  <circle class="pulse" cx="710" cy="554" r="5" fill="#ff4d8d"/>
  <text x="726" y="559" class="sans" font-size="13" fill="#dfe6f5">One cold run each. Stagehand is outside this comparison.</text>
</svg>
