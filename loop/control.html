<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser loop</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0e0e0c;
        --paper: #efeae0;
        --muted: #b4afa4;
        --line: #2c2b26;
        --amber: #f0a202;
        --amber-ink: #1c1507;
        --lime: #d6ff4a;
        --gap: #ff6b4a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      header, main { max-width: 920px; margin: 0 auto; padding: 28px 20px; }
      header { padding-bottom: 0; }
      p { color: var(--muted); }
      h1 { font: 400 44px/1 ui-serif, Georgia, serif; letter-spacing: -0.03em; margin: 0; }
      .mode { font: 12px/1 ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); }
      form { display: grid; gap: 12px; margin-top: 20px; }
      label { font: 12px/1 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      input, select {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        background: #141410;
        color: var(--paper);
        font: 16px/1.3 ui-sans-serif, system-ui, sans-serif;
      }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--paper);
        padding: 10px 16px;
        font: 12px/1 ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
      button.danger { color: var(--gap); border-color: var(--gap); }
      button:disabled { opacity: 0.4; cursor: default; }
      #detail { min-height: 1.4em; }
      #log {
        margin-top: 18px;
        min-height: 320px;
        max-height: 60vh;
        overflow: auto;
        white-space: pre-wrap;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        font: 13px/1.45 ui-monospace, monospace;
        color: var(--paper);
      }
    </style>
  </head>
  <body>
    <header>
      <p class="mode" id="mode">idle</p>
      <h1>Browser loop</h1>
      <p id="detail">Start runs the task. Step runs one planner call, then waits. Stop ends the run and leaves the browser open.</p>
    </header>
    <main>
      <form id="controls">
        <div>
          <label for="task">Task</label>
          <input id="task" name="task" value="Add milk to the packing list" autocomplete="off" />
        </div>
        <div>
          <label for="planner">Planner</label>
          <select id="planner" name="planner">
            <option value="fake" selected>Fake, no API key</option>
            <option value="model">Model, one chat completion</option>
          </select>
        </div>
        <div class="row">
          <button class="primary" type="button" id="start">Start</button>
          <button type="button" id="pause">Pause</button>
          <button type="button" id="step">Step</button>
          <button class="danger" type="button" id="stop">Stop</button>
        </div>
      </form>
      <pre id="log" aria-live="polite"></pre>
    </main>
    <script>
      const mode = document.getElementById("mode");
      const detail = document.getElementById("detail");
      const log = document.getElementById("log");
      const task = document.getElementById("task");
      const planner = document.getElementById("planner");

      function payload() {
        return { task: task.value, planner: planner.value };
      }

      async function post(path) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload()),
        });
        const body = await response.json();
        if (!response.ok) detail.textContent = body.error || "Request failed.";
      }

      document.getElementById("start").addEventListener("click", () => post("/api/start"));
      document.getElementById("pause").addEventListener("click", () => post("/api/pause"));
      document.getElementById("step").addEventListener("click", () => post("/api/step"));
      document.getElementById("stop").addEventListener("click", () => post("/api/stop"));

      function render(state) {
        mode.textContent = state.mode || "idle";
        if (state.detail) detail.textContent = state.detail;
        const lines = (state.events || []).map((event) => {
          let extra = "";
          if (event.kind === "observe" && event.controls && event.controls.length) {
            extra = "\n" + event.controls.map((control) => {
              const value = control.value ? " = " + control.value : "";
              return "         " + control.ref + "  " + control.role + "  " + control.name + value;
            }).join("\n");
          }
          return event.ts + "  " + event.line + extra;
        }).join("\n");
        if (log.textContent !== lines) {
          const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 48;
          log.textContent = lines;
          if (nearBottom) log.scrollTop = log.scrollHeight;
        }
      }

      async function poll() {
        try {
          const response = await fetch("/api/state");
          render(await response.json());
        } catch (error) {
          detail.textContent = "The control server is not responding.";
        }
      }

      poll();
      setInterval(poll, 400);
    </script>
  </body>
</html>
