[project]
name = "computer-use-loop"
version = "0.1.0"
description = "A thin local loop that attaches to Chrome, observes, and acts."
readme = "loop/README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.49"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["loop*", "bench*"]

[tool.setuptools.package-data]
loop = ["control.html", "fixture/*.html"]
bench = [
  "public/tasks.json",
  "public/fixtures/*.html",
  "holdout/tasks.json",
  "holdout/fixtures/*.html",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
