[project]
name = "computer-use-loop"
version = "0.1.0"
description = "Benchmark harness for the script_first to browser_use cascade."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.49"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.5"]
browser_use = ["browser-use==1.0.6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proxy*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts put the repo root on sys.path before importing bench.
"tools/*.py" = ["E402"]
# Cascade files under a live experiment; clean these up once it lands.
"bench/script_first.py" = ["E402"]
"bench/probe.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
